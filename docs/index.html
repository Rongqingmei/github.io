<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="LINYI 的个人文章站，记录技术、创作与缓慢思考。" />
  <title>LINYI — 写作 / 代码 / 长期主义</title>
  <style>
    :root{--paper:#f4f1ea;--ink:#151515;--muted:#716f6a;--line:#cbc7bd;--blue:#1846ee}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.top{height:76px;padding:0 4.6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:900;letter-spacing:-.08em;font-size:25px}.logo b{color:var(--blue)}nav{display:flex;gap:30px;font-size:13px}nav a:hover,.mail:hover,footer a:hover{color:var(--blue)}.intro{min-height:calc(100vh - 76px);padding:9.2vw 4.6vw 4vw;display:flex;flex-direction:column;justify-content:space-between}.small,.label,.head,time,.tags,footer{font-size:11px;letter-spacing:.1em;text-transform:uppercase}.small{margin:0;color:var(--muted)}h1{font-size:clamp(54px,8.5vw,132px);line-height:.88;letter-spacing:-.075em;margin:5.2vw 0 auto;font-weight:850}.introfoot{display:flex;justify-content:space-between;align-items:flex-end;font-size:15px;max-width:570px;line-height:1.45}.introfoot p{width:205px;margin:0}.orb{width:67px;height:67px;border:1px solid var(--ink);border-radius:50%;position:relative}.orb:before{content:"";position:absolute;width:17px;height:17px;background:var(--blue);right:-6px;top:3px}.orb:after{content:"";position:absolute;width:1px;height:105px;background:var(--ink);left:32px;top:-19px;transform:rotate(45deg)}.content{border-top:1px solid var(--line);display:grid;grid-template-columns:28% 1fr}.side{padding:48px 4.6vw;border-right:1px solid var(--line);min-height:640px}.label{color:var(--muted);margin:0 0 18px}.filters{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.filters button{padding:4px 0;color:var(--muted);background:none;border:0;cursor:pointer;font-size:17px}.filters button.active,.filters button:hover{color:var(--ink);font-weight:700}.filters button.active:before{content:"— ";color:var(--blue)}.about{margin-top:92px;font-size:13px;line-height:1.6;color:#484641}.about p:not(.label){margin:0 0 18px}.mail{color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px}.feed{padding:48px 4.6vw 80px}.head{display:flex;justify-content:space-between;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--ink)}.head p{margin:0}.post{display:grid;grid-template-columns:105px 1fr 25px;gap:20px;padding:29px 0 31px;border-bottom:1px solid var(--line);transition:padding .25s,color .25s}.post:hover{padding-left:12px;color:var(--blue)}time{color:var(--muted);padding-top:5px}.post h2{margin:0 0 10px;font-size:clamp(22px,2.35vw,36px);letter-spacing:-.05em;line-height:1.1}.post p{margin:0;color:var(--muted);font-size:14px}.tags{display:flex;gap:8px;margin-top:17px}.tags span{color:var(--ink);padding:3px 7px;border:1px solid var(--line);letter-spacing:0;font-size:10px}.arrow{font-size:20px}footer{border-top:1px solid var(--line);padding:24px 4.6vw;display:flex;gap:20px;justify-content:space-between;color:var(--muted)}footer p{margin:0}footer a{color:var(--ink)}@media(max-width:700px){.top{height:64px;padding:0 24px}nav{display:none}.intro{padding:72px 24px 28px;min-height:calc(100svh - 64px)}h1{font-size:clamp(48px,14vw,76px);margin:50px 0 auto}.content{display:block}.side{padding:32px 24px;border-right:0;min-height:0}.about{margin-top:42px}.feed{padding:32px 24px 60px}.post{grid-template-columns:1fr 20px;gap:10px;padding:25px 0}.post time{grid-column:1/-1;padding:0}.post h2{font-size:27px}.post p{font-size:13px}.orb{transform:scale(.78);transform-origin:right bottom}footer{padding:20px 24px;font-size:9px;gap:10px}}
  </style>
</head>
<body>
  <header class="top"><a class="logo" href="#top">LINYI<b>.</b></a><nav><a href="#writing">文章</a><a href="#about">关于</a><a href="mailto:hello@example.com">联系</a></nav></header>
  <main>
    <section class="intro" id="top"><p class="small">独立写作者 / 记录者 / 永远的学习者</p><h1>写点东西，<br>做点东西。</h1><div class="introfoot"><p>关于技术、创作和怎样慢一点思考。</p><span class="orb"></span></div></section>
    <section class="content" id="writing"><aside class="side"><p class="label">检索文章</p><div class="filters" id="filters"><button class="active">全部</button><button>随笔</button><button>写作</button><button>代码</button><button>方法</button><button>产品</button></div><div class="about" id="about"><p class="label">关于我</p><p>你好，我是 LINYI。这里是我的小小公开笔记本：把正在理解的事情，写成可以被分享的文字。</p><a class="mail" href="mailto:hello@example.com">来信交流 ↗</a></div></aside><div class="feed"><div class="head"><p>最新文章</p><span id="count">05 篇</span></div><div id="posts"></div></div></section>
  </main><footer><p>© 2026 LINYI</p><p>持续写作，缓慢生长。</p><a href="#top">回到顶部 ↑</a></footer>
  <script>
    const list=document.querySelector('#posts'),count=document.querySelector('#count');let posts=[];function draw(tag='全部'){const selected=tag==='全部'?posts:posts.filter(p=>p.tags.includes(tag));list.innerHTML=selected.map(p=>`<a class="post" href="posts/${p.slug}.html"><time>${p.date}</time><div><h2>${p.title}</h2><p>${p.summary}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div><b class="arrow">↗</b></a>`).join('');count.textContent=String(selected.length).padStart(2,'0')+' 篇'}document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');draw(b.textContent)});fetch('data/posts.json').then(r=>r.json()).then(data=>{posts=data;draw()}).catch(()=>{list.innerHTML='<p style="color:#716f6a;padding:32px 0">文章正在准备中。</p>'});
  </script>
</body>
</html>
