<p>这个网站终于有了第一篇真正的文章。</p>

<p>我希望它不只是一个展示页面，而是一个可以慢慢积累的地方：记录值得推敲的问题、未完成的想法，以及那些还没有答案的时刻。</p>

<h2>为什么要公开写作</h2>

<p>写下来，会迫使我把模糊的感受变成可讨论的句子。公开并不意味着要把一切都说得确定；它只是为思考留下一条可回看的路径。</p>

<p>所以，从这篇开始。</p>

<blockquote>t; 持续写作，缓慢生长。</blockquote></article></body></html>
